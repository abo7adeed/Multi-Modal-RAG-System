server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames make long caching safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API is same-origin behind this proxy, so the browser needs
    # no CORS preflight and the request ID is forwarded.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events: /api/v1/rag/stream.
        #
        # Buffering is the default and would defeat streaming
        # entirely - nginx would hold the whole answer before
        # forwarding a single byte. It must be off for every /api/
        # response, since the streaming route shares the prefix.
        proxy_buffering off;
        proxy_cache off;

        # Generation can take minutes; the default 60s read timeout
        # would cut a long answer off mid-stream.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Do not let nginx turn an upstream 429 into a 502.
        proxy_intercept_errors off;
    }

    # Retrieved page images, served by the API.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths render the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}